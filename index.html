<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Primary Browser Tab Favicon & Icons -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06202E" />
    <meta name="color-scheme" content="light" />

    <!-- Standard Primary SEO Meta Tags -->
    <title>ResQ Healthcare | Clinician Referral & Diagnostic Imaging Portal</title>
    <meta name="title" content="ResQ Healthcare | Clinician Referral & Diagnostic Imaging Portal" />
    <meta name="description" content="ResQ Healthcare is Africa's premier clinician referral network connecting doctors, diagnostic centers, and patients for seamless medical imaging, radiology, and care coordination." />
    <meta name="keywords" content="ResQ, ResQ Healthcare, medical referral, diagnostic imaging, clinician dashboard, radiology, CT scan, MRI scan, ultrasound, mammography, medical requisition, Africa healthcare" />
    <meta name="author" content="ResQ Healthcare Technologies" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://resq.healthcare/" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp SEO Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://resq.healthcare/" />
    <meta property="og:site_name" content="ResQ Healthcare" />
    <meta property="og:title" content="ResQ Healthcare | Clinician Referral & Diagnostic Imaging Portal" />
    <meta property="og:description" content="Connect with specialized diagnostic facilities, refer patients seamlessly, and track imaging requisitions with ResQ Healthcare." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:image:secure_url" content="/logo.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="72" />
    <meta property="og:image:height" content="72" />
    <meta property="og:image:alt" content="ResQ Healthcare Cross Pinwheel Official Logo" />

    <!-- Twitter / X Cards SEO Tags -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:url" content="https://resq.healthcare/" />
    <meta name="twitter:site" content="@ResQHealth" />
    <meta name="twitter:creator" content="@ResQHealth" />
    <meta name="twitter:title" content="ResQ Healthcare | Clinician Referral & Diagnostic Imaging Portal" />
    <meta name="twitter:description" content="Africa's leading network connecting clinicians, diagnostic providers, and patients for expedited imaging and care." />
    <meta name="twitter:image" content="/logo.png" />
    <meta name="twitter:image:alt" content="ResQ Healthcare Official Logo" />

    <!-- Structured JSON-LD Data for Search Engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://resq.healthcare/#organization",
          "name": "ResQ Healthcare",
          "url": "https://resq.healthcare/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://resq.healthcare/logo.png",
            "caption": "ResQ Healthcare Official Logo"
          },
          "image": "https://resq.healthcare/logo.png",
          "description": "Connecting clinicians, specialized diagnostic imaging centers, and patients across Africa."
        },
        {
          "@type": "WebSite",
          "@id": "https://resq.healthcare/#website",
          "url": "https://resq.healthcare/",
          "name": "ResQ Healthcare",
          "publisher": {
            "@id": "https://resq.healthcare/#organization"
          }
        }
      ]
    }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
